<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido de Refuerzo · Manifiesto de Carga</title>
<style>
  :root{
    --papel:#f4f1ea;
    --papel2:#ece7db;
    --kraft:#e3dcc9;
    --tinta:#16324f;
    --tinta-suave:#3d5a78;
    --naranja:#e8590c;
    --verde:#2b8a3e;
    --rojo:#c92a2a;
    --linea:#b9b09a;
    --mono:Consolas,"Courier New",monospace;
    --cond:"Arial Narrow","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--papel)}
  body{
    font-family:"Segoe UI",Arial,sans-serif;
    color:var(--tinta);
    background:
      repeating-linear-gradient(0deg,transparent 0 27px,rgba(22,50,79,.028) 27px 28px),
      var(--papel);
    padding-bottom:84px;
    min-width:1200px;
  }
  .hoja{max-width:1360px;margin:0 auto;padding:28px 36px 0}

  /* ============ CABECERA MANIFIESTO ============ */
  .manifiesto{
    border:3px solid var(--tinta);
    background:var(--papel2);
    position:relative;
    padding:22px 28px;
    display:flex;justify-content:space-between;align-items:stretch;gap:24px;
    box-shadow:6px 6px 0 rgba(22,50,79,.12);
  }
  .manifiesto::before{
    content:"";position:absolute;top:6px;left:6px;right:6px;bottom:6px;
    border:1px dashed var(--tinta);pointer-events:none;
  }
  .man-titulo{
    font-family:var(--cond);font-weight:900;text-transform:uppercase;
    font-size:38px;letter-spacing:3px;line-height:1;
  }
  .man-sub{
    margin-top:8px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--tinta-suave);
  }
  .man-meta{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--tinta-suave);line-height:1.7}
  .man-meta b{color:var(--tinta)}
  .sello-deadline{
    align-self:center;text-align:center;
    border:4px double var(--naranja);color:var(--naranja);
    padding:14px 26px;transform:rotate(-3deg);
    font-family:var(--cond);text-transform:uppercase;
    background:rgba(232,89,12,.06);
    min-width:210px;
  }
  .sello-deadline .num{font-family:var(--mono);font-size:56px;font-weight:900;line-height:1}
  .sello-deadline .lbl{font-size:14px;letter-spacing:3px;font-weight:700}
  .sello-deadline .fec{font-family:var(--mono);font-size:12px;margin-top:6px;letter-spacing:1px}

  /* ============ KPIs ============ */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:22px 0 0}
  .kpi{
    background:#fff;border:2px solid var(--tinta);border-top-width:7px;
    padding:12px 14px;position:relative;
  }
  .kpi.tono-ok{border-top-color:var(--verde)}
  .kpi.tono-alerta{border-top-color:var(--naranja)}
  .kpi.tono-neutro{border-top-color:var(--tinta)}
  .kpi .valor{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.1}
  .kpi .label{font-family:var(--cond);text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:700;margin-top:4px}
  .kpi .sub{font-size:11px;color:var(--tinta-suave);margin-top:4px}

  /* ============ CAPÍTULOS ============ */
  .perforacion{
    margin:34px -36px 0;border-top:2px dashed var(--linea);position:relative;height:0;
  }
  .perforacion::after{
    content:"✂";position:absolute;left:14px;top:-13px;font-size:16px;color:var(--linea);
    background:var(--papel);padding:0 6px;
  }
  .capitulo{margin-top:26px}
  .cap-head{display:flex;align-items:baseline;gap:14px;border-bottom:3px solid var(--tinta);padding-bottom:8px;margin-bottom:16px}
  .cap-form{
    font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2px;
    background:var(--tinta);color:var(--papel);padding:4px 10px;white-space:nowrap;
  }
  .cap-titulo{
    font-family:var(--cond);font-weight:900;text-transform:uppercase;
    font-size:26px;letter-spacing:2.5px;
  }
  .cap-nota{
    margin-top:14px;border-left:5px solid var(--naranja);background:rgba(232,89,12,.07);
    padding:10px 14px;font-size:13px;line-height:1.55;
  }

  /* ============ TABLAS ============ */
  table{border-collapse:collapse;width:100%;background:#fff;border:2px solid var(--tinta)}
  th,td{border:1px solid var(--linea);padding:8px 10px;font-size:13px;text-align:left}
  thead th{
    background:var(--tinta);color:var(--papel);font-family:var(--cond);
    text-transform:uppercase;letter-spacing:1.5px;font-size:12px;border-color:var(--tinta);
  }
  tbody tr:nth-child(even){background:rgba(22,50,79,.04)}
  .num{font-family:var(--mono);text-align:right;white-space:nowrap}
  .semaforo{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--tinta)}
  .sem-ok{background:var(--verde)}
  .sem-mal{background:var(--rojo)}
  tr.fila-alerta{background:rgba(201,42,42,.10)!important}
  tr.fila-alerta td{border-color:rgba(201,42,42,.4)}
  .brecha{font-family:var(--mono);color:var(--rojo);font-weight:700}

  /* ============ SELLOS ============ */
  .sello{
    display:inline-block;border:3px double currentColor;padding:3px 10px;
    font-family:var(--cond);font-weight:900;text-transform:uppercase;letter-spacing:2px;
    font-size:12px;transform:rotate(-4deg);white-space:nowrap;
  }
  .sello-rojo{color:var(--rojo);background:rgba(201,42,42,.06)}
  .sello-naranja{color:var(--naranja);background:rgba(232,89,12,.06)}
  .sello-verde{color:var(--verde);background:rgba(43,138,62,.06)}

  /* ============ TARJETAS DE ÍTEMS ============ */
  .items-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
  .item-card{
    background:#fff;border:2px solid var(--tinta);position:relative;padding:16px 18px 14px;
    box-shadow:4px 4px 0 rgba(22,50,79,.10);
  }
  .item-card.urgente{border-color:var(--rojo)}
  .item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .item-nombre{font-family:var(--cond);font-weight:900;text-transform:uppercase;font-size:18px;letter-spacing:1px;line-height:1.15}
  .item-id{font-family:var(--mono);font-size:11px;color:var(--tinta-suave);margin-top:3px}
  .item-sello{margin-top:2px}
  .item-tabla{margin-top:12px}
  .item-tabla table{border-width:1px}
  .item-tabla th,.item-tabla td{padding:5px 8px;font-size:12px}
  .barras{margin-top:12px}
  .barra-fila{display:flex;align-items:center;gap:10px;margin-top:6px}
  .barra-lbl{font-family:var(--cond);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;width:96px;color:var(--tinta-suave)}
  .barra-track{flex:1;height:14px;background:var(--papel2);border:1px solid var(--linea);position:relative}
  .barra-fill{height:100%}
  .fill-venta{background:var(--tinta)}
  .fill-stock{background:var(--verde)}
  .barra-val{font-family:var(--mono);font-size:12px;width:70px;text-align:right}
  .item-nota{margin-top:12px;font-size:12px;line-height:1.5;border-top:1px dashed var(--linea);padding-top:8px;color:var(--tinta-suave)}
  .sug-chip{
    display:inline-block;font-family:var(--mono);font-weight:700;font-size:13px;
    background:var(--tinta);color:var(--papel);padding:3px 10px;margin-top:8px;
  }

  /* ============ MATRIZ ============ */
  .matriz-wrap{overflow-x:auto;border:3px solid var(--tinta);background:#fff;box-shadow:6px 6px 0 rgba(22,50,79,.12)}
  .matriz{border:none;min-width:100%}
  .matriz thead th{position:sticky;top:0;z-index:2}
  .matriz th.col-tienda,.matriz td.col-tienda{position:sticky;left:0;background:#fff;z-index:1;min-width:230px}
  .matriz thead th.col-tienda{background:var(--tinta);z-index:3}
  .matriz tbody tr:nth-child(even) td.col-tienda{background:#f3f0e7}
  .matriz td.celda{padding:3px 4px;text-align:center;position:relative;cursor:help;min-width:92px}
  .matriz td.celda:hover{outline:2px solid var(--naranja);outline-offset:-2px}
  .matriz input{
    width:62px;font-family:var(--mono);font-size:14px;text-align:right;
    border:1px solid var(--linea);background:var(--papel);padding:4px 6px;color:var(--tinta);
  }
  .matriz input:focus{outline:2px solid var(--tinta);background:#fff}
  .punto-motivo{
    position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;
    background:var(--naranja);border:1px solid #fff;
  }
  .tag-tienda{
    display:inline-block;background:var(--kraft);border:1px solid var(--tinta);
    padding:3px 10px 3px 22px;position:relative;font-family:var(--cond);font-weight:700;
    text-transform:uppercase;letter-spacing:1px;font-size:13px;
    clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);
  }
  .tag-tienda::before{
    content:"";position:absolute;left:9px;top:50%;transform:translateY(-50%);
    width:6px;height:6px;border-radius:50%;background:var(--papel);border:1px solid var(--tinta);
  }
  .tag-num{font-family:var(--mono);font-size:11px;color:var(--tinta-suave);margin-left:8px}
  .badge-top{
    display:inline-block;background:var(--naranja);color:#fff;font-family:var(--cond);
    font-weight:900;font-size:10px;letter-spacing:1.5px;padding:2px 7px;margin-left:8px;
    text-transform:uppercase;transform:rotate(-2deg);
  }
  .tinfo{font-family:var(--mono);font-size:11px;color:var(--tinta-suave);margin-top:3px}
  .matriz tfoot td{background:var(--papel2);font-weight:700;border-top:2px solid var(--tinta)}
  .matriz tfoot tr.fila-q td{background:var(--kraft)}
  .total-alerta{background:rgba(201,42,42,.15)!important;color:var(--rojo)}
  .leyenda-alerta{
    display:none;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--rojo);
    font-weight:700;letter-spacing:.5px;
  }
  .leyenda-alerta.visible{display:block}
  .rowbar-cell{min-width:150px}
  .rowbar-track{height:10px;background:var(--papel2);border:1px solid var(--linea);margin-top:4px}
  .rowbar-fill{height:100%;background:var(--tinta)}
  .col-total-row{font-family:var(--mono);text-align:right;font-weight:700}

  /* ============ PANEL MOTIVO ============ */
  .motivo-panel{
    position:fixed;top:0;right:-380px;width:360px;height:100vh;background:#fff;
    border-left:3px solid var(--tinta);box-shadow:-6px 0 18px rgba(22,50,79,.2);
    transition:right .22s ease;z-index:50;padding:22px;display:flex;flex-direction:column;
  }
  .motivo-panel.abierto{right:0}
  .motivo-panel h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:2px;font-size:18px;border-bottom:3px solid var(--tinta);padding-bottom:8px}
  .motivo-cuerpo{margin-top:14px;font-size:13px;line-height:1.6;flex:1;overflow-y:auto}
  .motivo-cuerpo .m-tienda,.motivo-cuerpo .m-item{font-family:var(--mono);font-size:12px;color:var(--tinta-suave);margin-bottom:4px}
  .motivo-cuerpo .m-cajas{font-family:var(--mono);font-size:22px;font-weight:700;margin:10px 0}
  .motivo-cuerpo .m-texto{border-left:4px solid var(--naranja);padding:8px 12px;background:rgba(232,89,12,.06)}
  .motivo-cerrar{
    margin-top:14px;background:var(--tinta);color:var(--papel);border:none;padding:9px;
    font-family:var(--cond);text-transform:uppercase;letter-spacing:2px;font-weight:700;cursor:pointer;
  }

  /* ============ VILLA NUEVA / INCIDENTE ============ */
  .incidente{
    border:3px solid var(--rojo);background:#fff;position:relative;padding:20px 22px;
  }
  .incidente .sello-excluida{position:absolute;top:-16px;right:26px}
  .incidente h4{font-family:var(--cond);text-transform:uppercase;letter-spacing:2px;font-size:18px;color:var(--rojo);margin-bottom:12px}
  .fantasma{
    display:flex;align-items:center;gap:18px;margin:14px 0;border:2px dashed var(--rojo);
    padding:12px 16px;background:rgba(201,42,42,.05);
  }
  .fantasma .fnum{font-family:var(--mono);font-size:40px;font-weight:900;color:var(--rojo)}
  .fantasma .flbl{font-family:var(--cond);text-transform:uppercase;letter-spacing:2px;font-size:13px;font-weight:700}
  .dif-neg{color:var(--rojo);font-weight:700}

  /* ============ AJUSTES ============ */
  .ajustes-lista{list-style:none}
  .ajustes-lista li{
    background:#fff;border:2px solid var(--tinta);border-left:8px solid var(--naranja);
    padding:12px 16px;margin-bottom:10px;font-size:13px;line-height:1.55;
  }
  .ajustes-lista .a-tienda{font-family:var(--cond);font-weight:900;text-transform:uppercase;letter-spacing:1.5px;display:block;margin-bottom:3px}

  /* ============ NARRATIVA ============ */
  details{
    background:#fff;border:2px solid var(--tinta);margin-bottom:12px;
  }
  summary{
    cursor:pointer;padding:13px 18px;font-family:var(--cond);font-weight:900;
    text-transform:uppercase;letter-spacing:2px;font-size:16px;list-style:none;
    display:flex;align-items:center;gap:12px;
  }
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";font-family:var(--mono);transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  details .nar-cuerpo{padding:4px 22px 18px;border-top:1px dashed var(--linea)}
  details .nar-cuerpo p{font-size:13.5px;line-height:1.7;margin-top:12px}

  /* ============ PANEL DE DECISIÓN ============ */
  .panel-decision{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--tinta);color:var(--papel);
    border-top:4px solid var(--naranja);
    display:flex;align-items:center;gap:10px;padding:9px 24px;
  }
  .panel-decision .pd-titulo{
    font-family:var(--cond);font-weight:900;text-transform:uppercase;letter-spacing:2px;
    font-size:13px;margin-right:8px;white-space:nowrap;
  }
  .btn{
    font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
    font-size:12px;padding:8px 16px;cursor:pointer;border:2px solid var(--papel);
    background:transparent;color:var(--papel);white-space:nowrap;
  }
  .btn:hover{background:rgba(244,241,234,.15)}
  .btn.activo{background:var(--naranja);border-color:var(--naranja);color:#fff}
  .btn-sec{border-color:var(--linea);color:var(--kraft)}
  .indicador{
    margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:1px;
    color:var(--kraft);white-space:nowrap;
  }
  .indicador.editado{color:#ffd8a8}
  .totales-mini{font-family:var(--mono);font-size:12px;color:var(--papel);white-space:nowrap;border-left:1px solid rgba(244,241,234,.3);padding-left:14px}
</style>
</head>
<body>
<div class="hoja" id="app"></div>

<div class="motivo-panel" id="motivoPanel">
  <h3>Motivo de la celda</h3>
  <div class="motivo-cuerpo" id="motivoCuerpo"></div>
  <button class="motivo-cerrar" id="motivoCerrar">Cerrar</button>
</div>

<div class="panel-decision">
  <span class="pd-titulo">Panel de decisión</span>
  <button class="btn" id="btnRecomendado">Plan MEDICIÓN</button>
  <button class="btn" id="btnModelo">Plan modelo completo</button>
  <button class="btn btn-sec" id="btnCopiar">Copiar orden</button>
  <button class="btn btn-sec" id="btnCSV">Descargar CSV</button>
  <button class="btn btn-sec" id="btnReset">Restablecer</button>
  <span class="totales-mini" id="totalesMini"></span>
  <span class="indicador" id="indicador">SIN CAMBIOS</span>
</div>

var LS_KEY = "refuerzo-walmart-2026";
var state = {
  plan: "recomendado",          // "recomendado" | "modelo"
  edits: {},                    // "tienda|item" -> cajas (override del plan)
  dirty: false,
  savedAt: null
};

function cargarEstado(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var s = JSON.parse(raw);
      if(s && (s.plan === "recomendado" || s.plan === "modelo")){
        state.plan = s.plan;
        state.edits = (s.edits && typeof s.edits === "object") ? s.edits : {};
        state.dirty = Object.keys(state.edits).length > 0;
        state.savedAt = s.savedAt || null;
      }
    }
  }catch(e){ /* almacenamiento no disponible: se trabaja en memoria */ }
}

function guardarEstado(){
  state.savedAt = new Date().toISOString();
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      plan: state.plan, edits: state.edits, savedAt: state.savedAt
    }));
  }catch(e){ /* sin persistencia */ }
  pintarIndicador();
}

/* ============================================================
   UTILIDADES PURAS
============================================================ */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmtInt(n){
  n = Math.round(Number(n) || 0);
  return n.toLocaleString("es-GT");
}
function fmtQ(n){
  n = Number(n) || 0;
  return "Q" + n.toLocaleString("es-GT",{minimumFractionDigits:2, maximumFractionDigits:2});
}
function clave(t, i){ return t + "|" + i; }

function itemsDelPlan(){
  var vistos = {}, orden = [];
  ["recomendado","modelo"].forEach(function(p){
    (DATA.planes[p] || []).forEach(function(l){
      if(!vistos[l.item]){ vistos[l.item] = true; orden.push(l.item); }
    });
  });
  var porId = {};
  DATA.items.forEach(function(it){ porId[it.id] = it; });
  return orden.map(function(id){ return porId[id]; }).filter(Boolean);
}

function tiendasOrdenadas(){
  return DATA.tiendas.slice().sort(function(a,b){ return b.prom3 - a.prom3; });
}

function mapaPlan(plan){
  var m = {};
  (DATA.planes[plan] || []).forEach(function(l){
    m[clave(l.tienda, l.item)] = { cajas: Number(l.cajas) || 0, motivo: l.motivo || "" };
  });
  return m;
}

function cajasCelda(tnum, itemId){
  var k = clave(tnum, itemId);
  if(Object.prototype.hasOwnProperty.call(state.edits, k)) return state.edits[k];
  var pm = mapaPlan(state.plan)[k];
  return pm ? pm.cajas : 0;
}

function motivoCelda(tnum, itemId){
  var pm = mapaPlan(state.plan)[clave(tnum, itemId)];
  return pm ? pm.motivo : "";
}

/* Lee la matriz actual (inputs) y devuelve totales calculados */
function calcularTotales(){
  var items = itemsDelPlan();
  var tiendas = tiendasOrdenadas();
  var porItem = {}, filas = {}, gCajas = 0, gUnid = 0, gQ = 0;
  items.forEach(function(it){ porItem[it.id] = {cajas:0, unid:0, q:0, excede:false}; });
  tiendas.forEach(function(t){
    var c = 0;
    items.forEach(function(it){
      var cj = cajasCelda(t.num, it.id);
      if(cj > 0){
        var u = cj * it.ucaja;
        var q = u * it.costo;
        porItem[it.id].cajas += cj;
        porItem[it.id].unid  += u;
        porItem[it.id].q     += q;
        c += cj; gCajas += cj; gUnid += u; gQ += q;
      }
    });
    filas[t.num] = c;
  });
  items.forEach(function(it){
    porItem[it.id].excede = porItem[it.id].unid > it.bodega;
  });
  var maxFila = 0;
  tiendas.forEach(function(t){ if(filas[t.num] > maxFila) maxFila = filas[t.num]; });
  return { porItem: porItem, filas: filas, gCajas: gCajas, gUnid: gUnid, gQ: gQ, maxFila: maxFila };
}

      (it.nota ? '<div class="item-nota">' + esc(it.nota) + '</div>' : '') +
    '</article>';
  });
  return html + '</div></section>';
}

/* ============================================================
   RENDER — LA MATRIZ
============================================================ */
function renderMatriz(){
  var items = itemsDelPlan();
  var tiendas = tiendasOrdenadas();
  var tot = calcularTotales();

  var html = '<div class="perforacion"></div>' +
  '<section class="capitulo">' +
    '<div class="cap-head">' +
      '<span class="cap-form">FORM 03</span>' +
      '<span class="cap-titulo">La matriz de reparto</span>' +
      '<span class="sello sello-naranja" id="selloPlan">PLAN: ' + (state.plan === "recomendado" ? "RECOMENDADO" : "MODELO COMPLETO") + '</span>' +
    '</div>' +
    '<div class="matriz-wrap"><table class="matriz" id="tablaMatriz"><thead><tr>' +
      '<th class="col-tienda">Tienda</th>';
  items.forEach(function(it){
    html += '<th>' + esc(it.corto) + '<br><span style="font-family:var(--mono);font-size:10px;letter-spacing:0">' +
      esc(it.ucaja) + ' u/cj · bod ' + fmtInt(it.bodega) + '</span></th>';
  });
  html += '<th>Total fila</th></tr></thead><tbody>';

  tiendas.forEach(function(t){
    html += '<tr>' +
      '<td class="col-tienda">' +
        '<span class="tag-tienda">' + esc(t.nombre) + '</span>' +
        (t.top20 ? '<span class="badge-top">TOP-20</span>' : '') +
        '<span class="tag-num">' + esc(t.num) + '</span>' +
        '<div class="tinfo">prom3 ' + fmtInt(t.prom3) + ' · 628: ' + fmtInt(t.q628) + ' · 629: ' + fmtInt(t.q629) + ' · 630: ' + fmtInt(t.q630) + '</div>' +
      '</td>';
    items.forEach(function(it){
      var cj = cajasCelda(t.num, it.id);
      var mot = motivoCelda(t.num, it.id);
      html += '<td class="celda" data-tienda="' + esc(t.num) + '" data-item="' + esc(it.id) + '">' +
        '<input type="number" min="0" step="1" value="' + cj + '" data-tienda="' + esc(t.num) + '" data-item="' + esc(it.id) + '" aria-label="cajas ' + esc(t.nombre) + ' ' + esc(it.corto) + '">' +
        (mot ? '<span class="punto-motivo" title="Tiene motivo"></span>' : '') +
      '</td>';
    });
    var fc = tot.filas[t.num];
    var pct = tot.maxFila > 0 ? Math.round(fc / tot.maxFila * 100) : 0;
    html += '<td class="rowbar-cell">' +
      '<div class="col-total-row" data-totfila="' + esc(t.num) + '">' + fmtInt(fc) + ' cj</div>' +
      '<div class="rowbar-track"><div class="rowbar-fill" data-barrafila="' + esc(t.num) + '" style="width:' + pct + '%"></div></div>' +
    '</td></tr>';
  });

  html += '</tbody><tfoot>' +
    '<tr><td class="col-tienda">TOTAL CAJAS</td>';
  items.forEach(function(it){
    html += '<td class="num" data-totcajas="' + esc(it.id) + '">' + fmtInt(tot.porItem[it.id].cajas) + '</td>';
  });
  html += '<td class="num" id="totGCajas">' + fmtInt(tot.gCajas) + '</td></tr>' +
    '<tr><td class="col-tienda">TOTAL UNIDADES</td>';
  items.forEach(function(it){
    var p = tot.porItem[it.id];
    html += '<td class="num' + (p.excede ? ' total-alerta' : '') + '" data-totunid="' + esc(it.id) + '">' + fmtInt(p.unid) + '</td>';
  });
  html += '<td class="num" id="totGUnid">' + fmtInt(tot.gUnid) + '</td></tr>' +
    '<tr class="fila-q"><td class="col-tienda">TOTAL Q COSTO</td>';
  items.forEach(function(it){
    html += '<td class="num" data-totq="' + esc(it.id) + '">' + fmtQ(tot.porItem[it.id].q) + '</td>';
  });
  html += '<td class="num" id="totGQ">' + fmtQ(tot.gQ) + '</td></tr>' +
  '</tfoot></table></div>' +
  '<div class="leyenda-alerta" id="leyendaAlerta">▲ COLUMNA EN ALERTA: las unidades del ítem superan lo disponible en bodega.</div>' +
  '</section>';
  return html;
}

/* Recalcula totales en vivo sin re-renderizar la tabla */
function recalcMatriz(){
  var tot = calcularTotales();
  var items = itemsDelPlan();
  items.forEach(function(it){
    var p = tot.porItem[it.id];
    var cC = document.querySelector('[data-totcajas="' + it.id + '"]');
    var cU = document.querySelector('[data-totunid="' + it.id + '"]');
    var cQ = document.querySelector('[data-totq="' + it.id + '"]');
    if(cC) cC.textContent = fmtInt(p.cajas);
    if(cU){ cU.textContent = fmtInt(p.unid); cU.classList.toggle('total-alerta', p.excede); }
    if(cQ) cQ.textContent = fmtQ(p.q);
  });
  tiendasOrdenadas().forEach(function(t){
    var el = document.querySelector('[data-totfila="' + t.num + '"]');
    var bar = document.querySelector('[data-barrafila="' + t.num + '"]');
    if(el) el.textContent = fmtInt(tot.filas[t.num]) + ' cj';
    if(bar) bar.style.width = (tot.maxFila > 0 ? Math.round(tot.filas[t.num] / tot.maxFila * 100) : 0) + '%';
  });
  var g1 = document.getElementById('totGCajas'); if(g1) g1.textContent = fmtInt(tot.gCajas);
  var g2 = document.getElementById('totGUnid');  if(g2) g2.textContent = fmtInt(tot.gUnid);
  var g3 = document.getElementById('totGQ');     if(g3) g3.textContent = fmtQ(tot.gQ);
  var hayAlerta = items.some(function(it){ return tot.porItem[it.id].excede; });
  var ley = document.getElementById('leyendaAlerta');
  if(ley) ley.classList.toggle('visible', hayAlerta);
  var mini = document.getElementById('totalesMini');
  if(mini) mini.textContent = fmtInt(tot.gCajas) + ' cj · ' + fmtInt(tot.gUnid) + ' u · ' + fmtQ(tot.gQ);
}

/* ============================================================
   ENSAMBLADO DE LA PÁGINA
============================================================ */
function renderApp(){
  document.getElementById('app').innerHTML =
    renderCabecera() +
    renderKpis() +
    renderOC() +
    renderItems() +
    renderMatriz() +
    renderVillaNueva() +
    renderAjustes() +
    renderNarrativa();
  recalcMatriz();

/* ============================================================
   INDICADOR Y BOTONES DE PLAN
============================================================ */
function pintarIndicador(){
  var el = document.getElementById('indicador');
  if(!el) return;
  if(state.dirty){
    var hora = "";
    if(state.savedAt){
      var d = new Date(state.savedAt);
      hora = " " + ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
    }
    el.textContent = "● EDITADO · GUARDADO" + hora;
    el.classList.add('editado');
  }else{
    el.textContent = "SIN CAMBIOS";
    el.classList.remove('editado');
  }
}

function pintarBotonesPlan(){
  document.getElementById('btnRecomendado').classList.toggle('activo', state.plan === 'recomendado');
  document.getElementById('btnModelo').classList.toggle('activo', state.plan === 'modelo');
  var sello = document.getElementById('selloPlan');
  if(sello) sello.textContent = 'PLAN: ' + (state.plan === 'recomendado' ? 'RECOMENDADO' : 'MODELO COMPLETO');
}

function cambiarPlan(nuevo){
  if(nuevo === state.plan) return;
  if(state.dirty && !window.confirm('Hay ediciones sin aplicar a un plan. Al cambiar de plan se descartan las ediciones. ¿Continuar?')) return;
  state.plan = nuevo;
  state.edits = {};
  state.dirty = false;
  guardarEstado();
  renderApp();
  pintarIndicador();
}

/* ============================================================
   EXPORTACIONES
============================================================ */
function detalleLineas(){
  var items = itemsDelPlan();
  var tiendas = tiendasOrdenadas();
  var lineas = [];
  tiendas.forEach(function(t){
    items.forEach(function(it){
      var cj = cajasCelda(t.num, it.id);
      if(cj > 0){
        lineas.push({ tienda: t, item: it, cajas: cj, unid: cj * it.ucaja, q: cj * it.ucaja * it.costo });
      }
    });
  });
  return lineas;
}

function copiarOrden(){
  var items = itemsDelPlan();
  var tiendas = tiendasOrdenadas();
  var tot = calcularTotales();
  var porNom = {};
  tiendas.forEach(function(t){ porNom[t.num] = t.nombre; });
  var L = [];
  L.push('ORDEN DE REFUERZO — ' + DATA.meta.titulo);
  L.push('Plan: ' + (state.plan === 'recomendado' ? 'RECOMENDADO' : 'MODELO COMPLETO') + ' · Generado: ' + DATA.meta.generado);
  L.push('Totales: ' + fmtInt(tot.gCajas) + ' cajas · ' + fmtInt(tot.gUnid) + ' unidades · ' + fmtQ(tot.gQ));
  L.push('');
  items.forEach(function(it){
    var p = tot.porItem[it.id];
    if(p.cajas <= 0) return;
    L.push('■ ' + it.nombre + ' (' + it.id + ')');
    L.push('  Total: ' + fmtInt(p.cajas) + ' cajas · ' + fmtInt(p.unid) + ' u · ' + fmtQ(p.q));
    tiendas.forEach(function(t){
      var cj = cajasCelda(t.num, it.id);
      if(cj > 0) L.push('  - ' + t.nombre + ' (' + t.num + '): ' + fmtInt(cj) + ' cajas');
    });
    L.push('');
  });
  var texto = L.join('\n');

  function ok(){ avisoIndicador('ORDEN COPIADA AL PORTAPAPELES'); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); ok(); }
    catch(e){ avisoIndicador('NO SE PUDO COPIAR'); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(ok, fallback);
  }else fallback();
}

function avisoIndicador(msg){
  var el = document.getElementById('indicador');
  if(!el) return;
  var prev = el.textContent;
  el.textContent = msg;
  setTimeout(pintarIndicador, 2200);
}

function descargarCSV(){
  var lineas = detalleLineas();
  var filas = ['tienda_num,tienda,item,cajas,unidades,q_costo'];
  lineas.forEach(function(l){
    filas.push([
      l.tienda.num,
      '"' + String(l.tienda.nombre).replace(/"/g,'""') + '"',
      '"' + String(l.item.nombre).replace(/"/g,'""') + '"',
      l.cajas,
      l.unid,
      l.q.toFixed(2)
    ].join(','));
  });
  var uri = 'data:text/csv;charset=utf-8,' + encodeURIComponent(filas.join('\r\n'));
  var a = document.createElement('a');
  a.href = uri;
  a.download = 'pedido_refuerzo_' + state.plan + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  avisoIndicador('CSV DESCARGADO');
}

/* ============================================================
   EVENTOS (DELEGACIÓN)
============================================================ */
function abrirMotivo(td){
  var tnum = td.getAttribute('data-tienda');
  var iid = td.getAttribute('data-item');
  var t = null, it = null;
  DATA.tiendas.forEach(function(x){ if(x.num === tnum) t = x; });
  DATA.items.forEach(function(x){ if(x.id === iid) it = x; });
  if(!t || !it) return;
  var mot = motivoCelda(tnum, iid);
  var cj = cajasCelda(tnum, iid);
  document.getElementById('motivoCuerpo').innerHTML =
    '<div class="m-tienda">TIENDA: ' + esc(t.nombre) + ' (' + esc(t.num) + ')</div>' +
    '<div class="m-item">ÍTEM: ' + esc(it.nombre) + '</div>' +
    '<div class="m-cajas">' + fmtInt(cj) + ' cajas</div>' +
    '<div class="m-texto">' + (mot ? esc(mot) : 'Sin motivo registrado para esta celda en el plan activo.') + '</div>';
  document.getElementById('motivoPanel').classList.add('abierto');
}

function bindEventos(){
  document.addEventListener('input', function(ev){
    var inp = ev.target;
    if(!inp.matches || !inp.matches('#tablaMatriz input[type="number"]')) return;
    var v = parseInt(inp.value, 10);
    if(isNaN(v) || v < 0) v = 0;
    state.edits[clave(inp.getAttribute('data-tienda'), inp.getAttribute('data-item'))] = v;
    state.dirty = true;
    recalcMatriz();
    guardarEstado();
  });

  document.addEventListener('click', function(ev){
    var td = ev.target.closest ? ev.target.closest('#tablaMatriz td.celda') : null;
    if(td){ abrirMotivo(td); return; }
  });

  document.getElementById('motivoCerrar').addEventListener('click', function(){
    document.getElementById('motivoPanel').classList.remove('abierto');
  });
  document.addEventListener('keydown', function(ev){
    if(ev.key === 'Escape') document.getElementById('motivoPanel').classList.remove('abierto');
  });

  document.getElementById('btnRecomendado').addEventListener('click', function(){ cambiarPlan('recomendado'); });
  document.getElementById('btnModelo').addEventListener('click', function(){ cambiarPlan('modelo'); });
  document.getElementById('btnCopiar').addEventListener('click', copiarOrden);
  document.getElementById('btnCSV').addEventListener('click', descargarCSV);
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!window.confirm('¿Restablecer el tablero? Se borran las ediciones y vuelve el plan MEDICIÓN.')) return;
    state.plan = 'recomendado';
    state.edits = {};
    state.dirty = false;
    state.savedAt = null;
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    renderApp();
    pintarIndicador();
  });
}

/* ============================================================
   ARRANQUE
============================================================ */
cargarEstado();
renderApp();
bindEventos();
pintarIndicador();
</script>
